# BookRS-Platform — service topology.
#
# Only the ingestion service exists so far. bookrs-db, bookrs-api and
# bookrs-widget are added as they are built.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookrs
      POSTGRES_USER: bookrs
      # Development default only. A deployment supplies this via the
      # environment; nothing here is a production credential.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bookrs_dev}"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Applied automatically on first start of an empty volume.
      - ./bookrs/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./bookrs/db/test-db.sh:/docker-entrypoint-initdb.d/00-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrs -d bookrs"]
      interval: 3s
      timeout: 3s
      retries: 20

  ingestion:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    # Reach a Koha instance running on the host (koha-testing-docker,
    # or a real library's server) rather than inside this compose project.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Operator-supplied. Never derived from the repository's own
      # advertised baseURL, which Koha reports incorrectly.
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      # Separate database: the loader tests truncate every table.
      TEST_DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs_test"
      OAI_BASE_URL: "${OAI_BASE_URL:-http://host.docker.internal:8080/cgi-bin/koha/oai.pl}"
    volumes:
      # Bind-mounted during development so edits apply without rebuilding.
      - ./bookrs:/app/bookrs:ro
      - ./tests:/app/tests:ro
      # Config lives at the image root; mount it so local edits apply
      # without a rebuild, same as the source trees above.
      - ./pytest.ini:/app/pytest.ini:ro

  embedding:
    build:
      context: .
      dockerfile: docker/embedding.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      TEST_DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs_test"
      # Multilingual by default. Measured against a same-subject
      # similarity gap on real catalogue data, the multilingual model is
      # equivalent to all-MiniLM-L6-v2 on English (+0.604 vs +0.597) and
      # substantially better on non-English (+0.301 vs +0.169), so there
      # is no trade-off to weigh -- only a larger download and roughly
      # half the encoding throughput. Both are 384-dimensional, so the
      # schema is unaffected. Override for an English-only catalogue
      # where speed matters.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
    volumes:
      - ./bookrs:/app/bookrs:ro
      - ./tests:/app/tests:ro
      - model-cache:/app/.cache/huggingface

volumes:
  db-data:
  model-cache:
