# BookRS-Platform — service topology.
#
# Only the ingestion service exists so far. bookrs-db, bookrs-api and
# bookrs-widget are added as they are built.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookrs
      POSTGRES_USER: bookrs
      # Development default only. A deployment supplies this via the
      # environment; nothing here is a production credential.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bookrs_dev}"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Applied automatically on first start of an empty volume.
      - ./bookrs/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./bookrs/db/test-db.sh:/docker-entrypoint-initdb.d/00-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrs -d bookrs"]
      interval: 3s
      timeout: 3s
      retries: 20

  ingestion:
    # Two networks, because the direct reader (bookrs/ingestion/direct.py)
    # needs to reach the library's own database and OAI-PMH does not.
    # That asymmetry is a deployment fact worth noticing: this service can
    # harvest a catalogue from anywhere that can reach the OPAC over HTTP,
    # but reading what the API does not expose means sitting next to the
    # database. koha-net is declared external and optional -- a deployment
    # without it loses only the direct channel.
    networks: [default, koha-net]
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    # Reach a Koha instance running on the host (koha-testing-docker,
    # or a real library's server) rather than inside this compose project.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Operator-supplied. Never derived from the repository's own
      # advertised baseURL, which Koha reports incorrectly.
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      # Circulation harvest (python -m bookrs.ingestion.circulation). The
      # secret keys the patron HMAC; set it once per deployment and keep it.
      KOHA_REST_URL: "${KOHA_REST_URL:-http://host.docker.internal:8080}"
      KOHA_REST_USER: "${KOHA_REST_USER:-}"
      KOHA_REST_PASSWORD: "${KOHA_REST_PASSWORD:-}"
      BOOKRS_PATRON_SECRET: "${BOOKRS_PATRON_SECRET:-}"
      # Separate database: the loader tests truncate every table.
      TEST_DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs_test"
      OAI_BASE_URL: "${OAI_BASE_URL:-http://host.docker.internal:8080/cgi-bin/koha/oai.pl}"
    volumes:
      # Bind-mounted during development so edits apply without rebuilding.
      - ./bookrs:/app/bookrs:ro
      - ./tests:/app/tests:ro
      # Config lives at the image root; mount it so local edits apply
      # without a rebuild, same as the source trees above.
      - ./pytest.ini:/app/pytest.ini:ro

  embedding:
    build:
      context: .
      dockerfile: docker/embedding.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      TEST_DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs_test"
      # Multilingual by default. Measured against a same-subject
      # similarity gap on real catalogue data, the multilingual model is
      # equivalent to all-MiniLM-L6-v2 on English (+0.604 vs +0.597) and
      # substantially better on non-English (+0.301 vs +0.169), so there
      # is no trade-off to weigh -- only a larger download and roughly
      # half the encoding throughput. Both are 384-dimensional, so the
      # schema is unaffected. Override for an English-only catalogue
      # where speed matters.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
    volumes:
      - ./bookrs:/app/bookrs:ro
      - ./tests:/app/tests:ro
      - model-cache:/app/.cache/huggingface

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      TEST_DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs_test"
      # The library's OPAC origins, comma-separated. A real library has
      # one; both Koha instances are listed here because this setup runs
      # MARC21 and UNIMARC on different hostnames and the widget is
      # installed in both. A missing origin fails in the browser with no
      # server-side error: the panel simply never appears.
      BOOKRS_ALLOWED_ORIGINS: "${BOOKRS_ALLOWED_ORIGINS:-http://localhost:8080,http://unimarc.localhost,http://localhost:8090}"
      BOOKRS_ONNX_DIR: "/models/minilm-onnx/${BOOKRS_ONNX_VARIANT:-int8}"
      # Shared with the Koha plugin only. Enables /patrons/me/recommendations,
      # which Koha calls server to server for the logged-in patron; unset,
      # that route answers 503. The API never needs BOOKRS_PATRON_SECRET:
      # the plugin hashes the borrower number before it leaves Koha.
      BOOKRS_SERVICE_TOKEN: "${BOOKRS_SERVICE_TOKEN:-}"
    ports:
      - "8000:8000"
    volumes:
      - ./bookrs:/app/bookrs:ro
      - ./tests:/app/tests:ro
      - ./models/minilm-onnx:/models/minilm-onnx:ro

  recommend:
    build:
      context: .
      dockerfile: docker/recommend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      TEST_DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs_test"
      # Only the evaluation uses this (bookrs/evaluation/thesis.py): to
      # score the same readers the thesis scored it has to turn a Koha
      # borrower number into the patron_ref the reader stored, and the
      # keyed hash is the only way there. Training does not need it.
      BOOKRS_PATRON_SECRET: "${BOOKRS_PATRON_SECRET:-}"
    volumes:
      - ./bookrs:/app/bookrs:ro
      - ./tests:/app/tests:ro

  # Built-in scheduler (bookrs/schedule.py). Optional: none of these
  # starts unless the profile is asked for.
  #
  #   docker compose --profile schedule up -d
  #
  # Settings come from .env:
  #   BOOKRS_SOURCE_ID=54
  #   KOHA_DB_URL=mysql://<read-only user>:<password>@<koha db host>:3306/<koha db>
  #   BOOKRS_READ_EVERY=10m  BOOKRS_FULL_READ_EVERY=1d
  #   BOOKRS_EMBED_EVERY=1h  BOOKRS_REFIT_EVERY=1d
  # A cadence is 30m, 6h, 1d, 2w or off. Each job runs in the image that
  # carries its libraries, as one plain process; each run is recorded in
  # job_runs and shown under "jobs" in GET /health.
  schedule-read:
    profiles: [schedule]
    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
    networks: [default, koha-net]
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      KOHA_DB_URL: "${KOHA_DB_URL:-}"
      BOOKRS_PATRON_SECRET: "${BOOKRS_PATRON_SECRET:-}"
      BOOKRS_SOURCE_ID: "${BOOKRS_SOURCE_ID:-}"
      BOOKRS_READ_EVERY: "${BOOKRS_READ_EVERY:-1h}"
      # How often the read is a full one, which also catches ratings and
      # reviews that were removed; between them it reads changes only.
      BOOKRS_FULL_READ_EVERY: "${BOOKRS_FULL_READ_EVERY:-1d}"
    volumes:
      - ./bookrs:/app/bookrs:ro
    command: ["python", "-m", "bookrs.schedule", "read"]

  schedule-embed:
    profiles: [schedule]
    build:
      context: .
      dockerfile: docker/embedding.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}"
      BOOKRS_SOURCE_ID: "${BOOKRS_SOURCE_ID:-}"
      BOOKRS_EMBED_EVERY: "${BOOKRS_EMBED_EVERY:-1h}"
    volumes:
      - ./bookrs:/app/bookrs:ro
      - model-cache:/app/.cache/huggingface
    command: ["python", "-m", "bookrs.schedule", "embed"]

  schedule-refit:
    profiles: [schedule]
    build:
      context: .
      dockerfile: docker/recommend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      BOOKRS_SOURCE_ID: "${BOOKRS_SOURCE_ID:-}"
      BOOKRS_REFIT_EVERY: "${BOOKRS_REFIT_EVERY:-1d}"
    volumes:
      - ./bookrs:/app/bookrs:ro
    command: ["python", "-m", "bookrs.schedule", "refit"]

  # Test environment, not a service. Carries node for the widget
  # harness, which the service images deliberately do not — see
  # docker/test.Dockerfile.
  #
  #   docker compose run --rm test python -m pytest
  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs"
      TEST_DATABASE_URL: "postgresql://bookrs:${POSTGRES_PASSWORD:-bookrs_dev}@db:5432/bookrs_test"
    volumes:
      - ./bookrs:/app/bookrs:ro
      - ./tests:/app/tests:ro
      # The Dockerfiles are themselves under test — see
      # tests/test_dockerfiles.py. Without this the guards have nothing
      # to read.
      - ./docker:/app/docker:ro
      # So is the README: a test asserts it documents the scheduling
      # this project deliberately does not automate. Unmounted, that
      # guard skipped, which is a guard reporting nothing.
      - ./README.md:/app/README.md:ro

volumes:
  db-data:
  model-cache:

networks:
  default:
  koha-net:
    external: true
    name: kohadev_kohanet
